[workspace]
resolver = "2"
members = ["crates/rookery-core", "crates/rookery-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "10", features = ["serde-compat"] }
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Key derivation (vault unlock, backup files) must be fast in every build: optimise the crypto crates fully.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.release.package.argon2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
