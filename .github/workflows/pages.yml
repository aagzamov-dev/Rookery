# Website (site/) → GitHub Pages: https://aagzamov-dev.github.io/Rookery/
# Plain HTML / CSS / JS, no build step. Runs only when the site, its screenshots or the icon
# change; it never touches the app's CI or release workflows.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "app-icon.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (pages + the screenshots and icon it shows)
        run: |
          mkdir -p _site/screenshots
          cp -r site/. _site/
          for s in terminal dashboard docker editor editor-merge sql-table sql-structure snippets; do
            cp "docs/screenshots/$s.png" _site/screenshots/
          done
          cp app-icon.svg _site/icon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
