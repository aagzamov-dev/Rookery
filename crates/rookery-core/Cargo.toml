[package]
name = "rookery-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rookery core: vault, storage, SSH sessions, collectors. No UI dependencies."

[lib]
name = "rookery_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
ts-rs.workspace = true
parking_lot.workspace = true

# storage
rusqlite = { version = "0.34", features = ["bundled"] }
rusqlite_migration = "2"

# crypto / vault
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# ssh
russh = "0.52"
russh-sftp = "2"

# SQL connections (v0.7). TLS through rustls + ring only: aws-lc-rs needs cmake / NASM on Windows.
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
url = "2"
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }

# misc
dirs = "6"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "local-offset", "macros"] }

# Local terminal tabs (desktop only)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
