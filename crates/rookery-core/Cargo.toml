[package]
name = "rookery-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rookery core: vault, storage, SSH sessions, collectors. No UI dependencies."

[lib]
name = "rookery_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
ts-rs.workspace = true
parking_lot.workspace = true

# storage
rusqlite = { version = "0.34", features = ["bundled"] }
rusqlite_migration = "2"

# crypto / vault
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# ssh
russh = "0.52"
russh-sftp = "2"

# misc
dirs = "6"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "local-offset", "macros"] }

# Local terminal tabs (desktop only)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
